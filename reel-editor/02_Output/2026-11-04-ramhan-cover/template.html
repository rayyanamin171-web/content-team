<!doctype html>
<!--
  Ramhan Island cover (Episode 2). 1080x1920; text in the top part of the safe area (y 168+) and inside the 4:5 grid crop (y 285-1635).
  The text lines are PROVISIONAL until the original cover arrives from the Mac: then match its exact layout, sizes and wording.
  URL params: bg=<plate> l1=<series line> l2=<episode line> l3=<island name> credit=0|1
-->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "RM Serif"; src: url("../../toolkit/fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "RM Sans"; src: url("../../toolkit/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0E1A2B; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: 50% 50%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,26,43,.88) 0%, rgba(14,26,43,.55) 26%, rgba(14,26,43,0) 44%, rgba(14,26,43,0) 80%, rgba(14,26,43,.55) 100%); }
  .box { position: absolute; left: 72px; right: 72px; top: 300px; text-align: center; color: #F5F1E8; }
  .l1 { font: 600 30px/1.3 "RM Sans", sans-serif; letter-spacing: 6px; text-transform: uppercase; }
  .l2 { font: 600 34px/1 "RM Sans", sans-serif; letter-spacing: 8px; text-transform: uppercase; color: #C8A15A; margin-top: 26px; }
  .rule { width: 140px; height: 4px; background: #C8A15A; margin: 30px auto 26px; }
  .l3 { font: 700 150px/0.98 "RM Serif", serif; letter-spacing: -1px; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .credit { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font: 600 20px/1 "RM Sans", sans-serif; color: rgba(245,241,232,.7); letter-spacing: .5px; }
</style></head>
<body>
  <div class="bg" id="bg"></div><div class="shade"></div>
  <div class="box"><div class="l1" id="l1"></div><div class="l2" id="l2"></div><div class="rule"></div><div class="l3" id="l3"></div></div>
  <div class="credit" id="credit">Satellite image: contains modified Copernicus Sentinel data 2026</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("bg").style.backgroundImage = `url("${q.get("bg")}")`;
  document.getElementById("l1").textContent = q.get("l1") || "Abu Dhabi's 7 Islands Real Estate Series";
  document.getElementById("l2").textContent = q.get("l2") || "Episode 2";
  const l3 = document.getElementById("l3"); const w = (q.get("l3") || "Ramhan Island").split(" ");
  l3.textContent = ""; l3.append(w.slice(0, -1).join(" ")); l3.append(document.createElement("br")); l3.append(w.at(-1));
  if (q.get("credit") === "0") document.getElementById("credit").remove();
</script>
</body></html>
