<!doctype html>
<!--
  Reel map renderer (Rayan Maniya · Abu Dhabi Series look)
  Loaded by render_map.mjs through a local web server. Everything is offline:
  MapLibre GL (BSD-3, vendored), local GeoJSON (Overture/OSM, Natural Earth), local Sentinel-2 JPEG.
  The page exposes window.renderFrame(t) so every video frame is drawn deterministically.
  URL: map.html?scene=<path to scene json, relative to this folder>
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../vendor/maplibre-gl.css">
<style>
  @font-face { font-family: "Playfair Display"; src: url("../fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Playfair Display"; src: url("../fonts/playfair-display-latin-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
  @font-face { font-family: "Inter"; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root { --navy: #0E1A2B; --gold: #C8A15A; --paper: #F5F1E8; --gold-soft: rgba(200,161,90,.35); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; } /* we draw our own credit line */
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 120% 75% at 50% 48%, rgba(14,26,43,0) 55%, rgba(14,26,43,.55) 100%),
                linear-gradient(180deg, rgba(14,26,43,.55) 0%, rgba(14,26,43,0) 16%, rgba(14,26,43,0) 74%, rgba(14,26,43,.7) 100%); }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #ov { position: absolute; inset: 0; pointer-events: none; font-family: "Inter", sans-serif; }
  .lbl { position: absolute; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; color: var(--paper); }
  .lbl .t { font-family: "Playfair Display", serif; font-weight: 700; letter-spacing: .5px; text-shadow: 0 3px 18px rgba(0,0,0,.55); }
  .lbl .s { font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: var(--gold); margin-top: 6px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .k-country .t { font-size: 120px; } .k-country .s { font-size: 30px; }
  .k-city .t { font-size: 84px; } .k-city .s { font-size: 28px; }
  .k-area .t { font-size: 64px; } .k-area .s { font-size: 26px; }
  .k-small .t { font-size: 40px; } .k-small .s { font-size: 22px; letter-spacing: 4px; }
  /* Pins: gold drop, label card to the right */
  .pin { position: absolute; width: 0; height: 0; }
  .pin .stem { position: absolute; left: -2px; bottom: 0; width: 4px; background: linear-gradient(var(--gold), rgba(200,161,90,0)); transform-origin: bottom; }
  .pin .head { position: absolute; left: -17px; width: 34px; height: 34px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 6px rgba(200,161,90,.28), 0 6px 18px rgba(0,0,0,.5); }
  .pin .head::after { content: ""; position: absolute; left: 11px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--navy); }
  .pin .ring { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--gold); }
  .pin .card { position: absolute; left: 30px; padding: 12px 20px 12px 18px; background: rgba(14,26,43,.86); border-left: 4px solid var(--gold);
    color: var(--paper); white-space: nowrap; box-shadow: 0 8px 26px rgba(0,0,0,.35); }
  .pin .card .t { font-weight: 600; font-size: 42px; letter-spacing: .2px; }
  .pin .card .s { font-weight: 600; font-size: 22px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-top: 4px; }
  .pin.main .head { left: -24px; width: 48px; height: 48px; } .pin.main .head::after { left: 16px; top: 16px; width: 16px; height: 16px; }
  .pin.main .card { left: 0; border-left: 0; border-bottom: 4px solid var(--gold); text-align: center; padding: 14px 30px; }
  .pin.main .card .t { font-family: "Playfair Display", serif; font-weight: 700; font-size: 60px; }
  .dest { position: absolute; transform: translate(-50%, -100%); background: rgba(14,26,43,.88); border-bottom: 4px solid var(--gold); color: var(--paper); padding: 10px 20px; font-weight: 600; font-size: 36px; white-space: nowrap; }
  .pin.left .card { left: auto; right: 30px; border-left: 0; border-right: 4px solid var(--gold); text-align: right; }
  /* Callout label */
  .co { position: absolute; transform: translate(-50%, -50%); background: var(--paper); color: var(--navy); padding: 12px 22px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); white-space: nowrap; }
  .co .t { font-weight: 700; font-size: 44px; letter-spacing: .5px; }
  .co .s { font-weight: 600; font-size: 19px; letter-spacing: 4px; text-transform: uppercase; color: #6B5426; margin-top: 2px; }
  .co.placeholder { outline: 3px dashed #E5484D; }
  #credit { position: absolute; left: 64px; right: 170px; top: 1262px; color: rgba(245,241,232,.72); font: 500 19px/1.35 "Inter", sans-serif;
    letter-spacing: .2px; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div id="map"></div>
<svg id="fx" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="vignette"></div>
<div id="ov"></div>
<div id="credit"></div>
<script src="../vendor/maplibre-gl.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const W = 1080, H = 1920;
const C = { navy: "#0E1A2B", navy2: "#132238", land: "#1A2A40", land2: "#22354F", gold: "#C8A15A", paper: "#F5F1E8" };

/* ---------- easing + keyframe helpers ---------- */
const E = {
  linear: x => x,
  inOutCubic: x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inOutQuint: x => x < .5 ? 16*x*x*x*x*x : 1 - Math.pow(-2*x + 2, 5) / 2,
};
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
function track(kfs, t) { // [[t, v], ...] linear with inOutSine
  if (!kfs || !kfs.length) return 1;
  if (t <= kfs[0][0]) return kfs[0][1];
  for (let i = 1; i < kfs.length; i++) if (t <= kfs[i][0]) {
    const [t0, v0] = kfs[i-1], [t1, v1] = kfs[i];
    return v0 + (v1 - v0) * E.inOutSine((t - t0) / Math.max(1e-6, t1 - t0));
  }
  return kfs[kfs.length - 1][1];
}
const merc = ([lon, lat]) => [ (lon + 180) / 360, (1 - Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360)) / Math.PI) / 2 ];
const unmerc = ([x, y]) => [ x*360 - 180, (360/Math.PI) * Math.atan(Math.exp((1 - 2*y) * Math.PI)) - 90 ];
function camera(kfs, t) {
  if (t <= kfs[0].t) return kfs[0];
  for (let i = 1; i < kfs.length; i++) if (t <= kfs[i].t) {
    const a = kfs[i-1], b = kfs[i];
    const e = E[b.ease || "inOutCubic"]((t - a.t) / (b.t - a.t));
    const zoom = a.zoom + (b.zoom - a.zoom) * e;
    // Scale-aware centre path: the target stays visually anchored while zooming (feels like a real fly-in)
    let u = e;
    if (Math.abs(b.zoom - a.zoom) > 0.5) {
      const s0 = Math.pow(2, -a.zoom), s1 = Math.pow(2, -b.zoom), s = Math.pow(2, -zoom);
      u = (s0 - s) / (s0 - s1);
    }
    const m0 = merc(a.center), m1 = merc(b.center);
    const center = unmerc([m0[0] + (m1[0]-m0[0])*u, m0[1] + (m1[1]-m0[1])*u]);
    const lerp = k => (a[k] ?? 0) + ((b[k] ?? 0) - (a[k] ?? 0)) * e;
    return { center, zoom, pitch: lerp("pitch"), bearing: lerp("bearing") };
  }
  return kfs[kfs.length - 1];
}
function haversineKm(a, b) {
  const R = 6371.0088, r = Math.PI / 180;
  const dLat = (b[1]-a[1])*r, dLon = (b[0]-a[0])*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// fade window: [in, out] -> 0..1 with ramp
function win(tw, t, rin = .35, rout = .3) {
  if (!tw) return 1;
  const [a, b] = tw;
  if (t < a || t > b) return 0;
  return Math.min(clamp((t - a) / rin), clamp((b - t) / rout));
}

/* ---------- build ---------- */
let scene, map;
async function init() {
  scene = await (await fetch(qs.get("scene"))).json();
  const D = scene.render_dir.replace(/\/$/, "") + "/";
  const sat = scene.satellite ? await (await fetch(scene.satellite + ".json")).json() : null;
  const satUrl = scene.satellite ? new URL(scene.satellite, location.href).href : null;
  const g = name => ({ type: "geojson", data: new URL(D + name, location.href).href, tolerance: 0.2 });

  const style = {
    version: 8,
    sources: {
      rland: g("region-land.geojson"), rcountries: g("region-countries.geojson"), remirates: g("region-emirates.geojson"),
      cland: g("city-land.geojson"), cwater: g("city-water.geojson"), croads: g("city-roads.geojson"),
      bld: g("area-buildings.geojson"), aroads: g("area-roads.geojson"), island: g("island.geojson"),
      ...(sat ? { sat: { type: "image", url: satUrl, coordinates: sat.coordinates } } : {}),
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": C.navy } },
      // Region (Natural Earth): stylised UAE at country scale
      { id: "r-land", type: "fill", source: "rland", paint: { "fill-color": C.land, "fill-opacity": 1 } },
      { id: "r-uae", type: "fill", source: "rcountries", filter: ["==", ["get", "iso"], scene.highlight_country || "ARE"], paint: { "fill-color": C.land2, "fill-opacity": 1 } },
      { id: "r-emirate", type: "fill", source: "remirates", filter: ["==", ["get", "name"], scene.highlight_emirate || "Abu Dhabi"], paint: { "fill-color": C.gold, "fill-opacity": .16 } },
      { id: "r-borders", type: "line", source: "rcountries", paint: { "line-color": C.paper, "line-opacity": .22, "line-width": 1.5 } },
      { id: "r-emirate-line", type: "line", source: "remirates", filter: ["==", ["get", "name"], scene.highlight_emirate || "Abu Dhabi"], paint: { "line-color": C.gold, "line-width": 3, "line-opacity": .9 } },
      { id: "r-uae-line", type: "line", source: "rcountries", filter: ["==", ["get", "iso"], scene.highlight_country || "ARE"], paint: { "line-color": C.gold, "line-width": 2, "line-opacity": .6 } },
      // City (Overture vector "blueprint")
      { id: "c-land", type: "fill", source: "cland", filter: ["in", ["get", "class"], ["literal", ["land", "island", "islet", "peninsula"]]], paint: { "fill-color": C.land, "fill-opacity": 1 } },
      { id: "c-water", type: "fill", source: "cwater", paint: { "fill-color": C.navy, "fill-opacity": 1 } },
      { id: "c-roads", type: "line", source: "croads", paint: { "line-color": C.gold,
          "line-opacity": ["match", ["get", "class"], "motorway", .55, "trunk", .5, "primary", .38, .22],
          "line-width": ["interpolate", ["exponential", 1.6], ["zoom"], 9, ["match", ["get", "class"], "motorway", 1.4, "trunk", 1.2, .6], 15, ["match", ["get", "class"], "motorway", 7, "trunk", 6, "primary", 4.5, 3]] } },
      { id: "a-roads", type: "line", source: "aroads", minzoom: 12, paint: { "line-color": C.paper, "line-opacity": .14,
          "line-width": ["interpolate", ["exponential", 1.6], ["zoom"], 13, .6, 17, 4] } },
      // Satellite (Sentinel-2) on top of the vector base so it can cross-fade
      ...(sat ? [{ id: "sat", type: "raster", source: "sat", paint: { "raster-opacity": 0, "raster-fade-duration": 0,
          "raster-saturation": -0.3, "raster-contrast": 0.12, "raster-brightness-max": 0.82, "raster-brightness-min": 0.02, "raster-resampling": "linear" } },
        { id: "sat-tint", type: "background", paint: { "background-color": C.navy, "background-opacity": 0 } }] : []),
      // Island highlight
      { id: "island-fill", type: "fill", source: "island", paint: { "fill-color": C.gold, "fill-opacity": 0 } },
      { id: "island-glow", type: "line", source: "island", paint: { "line-color": C.gold, "line-width": 22, "line-blur": 18, "line-opacity": 0 } },
      { id: "island-line", type: "line", source: "island", paint: { "line-color": C.gold, "line-width": 4.5, "line-opacity": 0 } },
      // 3D buildings: island towers in warm off-white, surroundings in navy
      { id: "bld", type: "fill-extrusion", source: "bld", minzoom: 12, paint: {
          "fill-extrusion-color": ["case", ["get", "on_island"], "#E8DFCB", "#2B3E5C"],
          "fill-extrusion-height": ["*", ["get", "h"], ["coalesce", ["global-state", "hscale"], 1]],
          "fill-extrusion-base": 0, "fill-extrusion-opacity": 0, "fill-extrusion-vertical-gradient": true } },
    ],
    light: { anchor: "map", color: "#FFF4E0", intensity: 0.45, position: [1.2, 210, 35] },
  };
  map = new maplibregl.Map({
    container: "map", style, interactive: false, attributionControl: false, fadeDuration: 0,
    preserveDrawingBuffer: true, pixelRatio: 1, center: scene.camera[0].center, zoom: scene.camera[0].zoom,
    maxPitch: 75, canvasContextAttributes: { antialias: true, preserveDrawingBuffer: true },
  });
  await new Promise(r => map.once("load", r));
  await document.fonts.ready;

  // Credit line (built from the datasets actually on screen)
  const src = await (await fetch(D + "sources.json")).json();
  const parts = [];
  if (src["OpenStreetMap"] || src["TomTom"] || src["Microsoft ML Buildings"]) parts.push("Map data © OpenStreetMap contributors (ODbL), via Overture Maps Foundation");
  if (src["Natural Earth"]) parts.push("Natural Earth");
  if (sat) parts.push(sat.credit);
  document.getElementById("credit").textContent = scene.credit || parts.join(" · ");
  window.__ready = true;
}

/* ---------- overlays ---------- */
const ov = document.getElementById("ov"), fx = document.getElementById("fx");
function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
function drawOverlays(t) {
  ov.innerHTML = ""; fx.innerHTML = "";
  const proj = ll => map.project(ll);
  for (const L of scene.labels || []) {
    const a = win(L.t, t, .45, .35); if (a <= 0) continue;
    const p = proj(L.lonlat), e = el(`<div class="lbl k-${L.kind || "city"}"><div class="t"></div>${L.sub ? '<div class="s"></div>' : ""}</div>`);
    e.querySelector(".t").textContent = L.text; if (L.sub) e.querySelector(".s").textContent = L.sub;
    const dx = L.offset ? L.offset[0] : 0, dy = L.offset ? L.offset[1] : 0;
    e.style.left = (p.x + dx) + "px"; e.style.top = (p.y + dy) + "px"; e.style.opacity = a;
    e.style.transform = `translate(-50%, -50%) translateY(${(1 - E.outCubic(a)) * 24}px)`;
    ov.append(e);
  }
  for (const P of scene.pins || []) {
    if (!P.t || t < P.t[0] || t > P.t[1]) continue;
    const k = (t - P.t[0]), out = clamp((P.t[1] - t) / .3);
    const p = proj(P.lonlat);
    const drop = E.outBack(clamp(k / .55)), stemH = (P.kind === "main" ? 120 : 80) * drop;
    const e = el(`<div class="pin ${P.kind || ""} ${P.side === "left" ? "left" : ""}"><div class="ring"></div><div class="stem"></div><div class="head"></div><div class="card"><div class="t"></div>${P.sub ? '<div class="s"></div>' : ""}</div></div>`);
    e.style.left = p.x + "px"; e.style.top = p.y + "px"; e.style.opacity = out;
    e.querySelector(".stem").style.height = stemH + "px";
    const head = e.querySelector(".head"), hs = P.kind === "main" ? 48 : 34;
    head.style.top = (-stemH - hs / 2) + "px"; head.style.opacity = clamp(k / .15);
    const ring = e.querySelector(".ring"), rp = ((k % 1.6) / 1.6);
    ring.style.transform = `scale(${0.3 + rp * 1.4})`; ring.style.opacity = (1 - rp) * clamp(k / .5) * .9;
    const card = e.querySelector(".card"), ca = clamp((k - .3) / .35);
    card.querySelector(".t").textContent = P.label; if (P.sub) card.querySelector(".s").textContent = P.sub;
    card.style.opacity = ca;
    if (P.kind === "main") {
      card.style.top = (-stemH - hs - 150) + "px";
      card.style.transform = `translate(-50%, ${(1 - E.outCubic(ca)) * 16}px)`;
    } else {
      card.style.top = (-stemH - hs / 2 - 32) + "px";
      card.style.transform = `translateX(${(1 - E.outCubic(ca)) * (P.side === "left" ? 20 : -20)}px)`;
    }
    ov.append(e);
  }
  for (const Co of scene.callouts || []) {
    if (!Co.t || t < Co.t[0] || t > Co.t[1]) continue;
    const k = t - Co.t[0], out = clamp((Co.t[1] - t) / .3);
    const a = proj(Co.from), b = proj(Co.to);
    const draw = E.inOutCubic(clamp(k / (Co.draw || 1.1)));
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const ns = "http://www.w3.org/2000/svg";
    const g = document.createElementNS(ns, "g"); g.setAttribute("opacity", out);
    // straight-line (or route) path
    let d;
    if (Co.path && Co.path.length > 1) {
      const pts = Co.path.map(proj); d = "M" + pts.map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(" L");
    } else d = `M${a.x},${a.y} L${b.x},${b.y}`;
    const path = document.createElementNS(ns, "path"); path.setAttribute("d", d);
    path.setAttribute("fill", "none"); path.setAttribute("stroke", C.gold); path.setAttribute("stroke-width", 6);
    path.setAttribute("stroke-linecap", "round"); g.append(path); fx.append(g);
    const total = path.getTotalLength();
    path.setAttribute("stroke-dasharray", Co.dashed === false ? `${total}` : "18 14");
    // reveal using a mask-like trick: clip by dashoffset on a solid copy
    if (Co.dashed === false) path.setAttribute("stroke-dashoffset", total * (1 - draw));
    else {
      const clip = document.createElementNS(ns, "clipPath"); clip.id = "cp" + Math.random().toString(36).slice(2);
      const rev = document.createElementNS(ns, "path"); rev.setAttribute("d", d); rev.setAttribute("fill", "none");
      rev.setAttribute("stroke", "#fff"); rev.setAttribute("stroke-width", 40);
      rev.setAttribute("stroke-dasharray", `${total}`); rev.setAttribute("stroke-dashoffset", total * (1 - draw));
      // SVG clipPath ignores stroke, so use a mask instead
      const mask = document.createElementNS(ns, "mask"); mask.id = clip.id; mask.setAttribute("maskUnits", "userSpaceOnUse");
      mask.setAttribute("x", 0); mask.setAttribute("y", 0); mask.setAttribute("width", W); mask.setAttribute("height", H);
      mask.append(rev); fx.append(mask); path.setAttribute("mask", `url(#${clip.id})`);
    }
    for (const [q, r0] of [[a, 11], [b, 14]]) {
      const c = document.createElementNS(ns, "circle"); c.setAttribute("cx", q.x); c.setAttribute("cy", q.y); c.setAttribute("r", r0);
      c.setAttribute("fill", q === a ? C.gold : C.paper); c.setAttribute("stroke", C.gold); c.setAttribute("stroke-width", 4);
      c.setAttribute("opacity", q === a ? 1 : clamp((draw - .9) / .1)); g.append(c);
    }
    // label
    const la = clamp((k - (Co.draw || 1.1) + .15) / .35);
    if (la > 0) {
      const km = haversineKm(Co.from, Co.to);
      const text = (Co.label || "≈ {km} km").replace("{km}", km < 10 ? km.toFixed(1) : Math.round(km));
      const e = el(`<div class="co ${Co.placeholder ? "placeholder" : ""}"><div class="t"></div>${Co.sub ? '<div class="s"></div>' : ""}</div>`);
      e.querySelector(".t").textContent = text; if (Co.sub) e.querySelector(".s").textContent = Co.sub;
      const m = Co.label_at === "end" ? b : { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const off = Co.label_offset || [0, 0];
      e.style.left = (m.x + off[0]) + "px"; e.style.top = (m.y + off[1]) + "px"; e.style.opacity = la * out;
      e.style.transform = `translate(-50%, -50%) scale(${0.85 + 0.15 * E.outBack(la)})`;
      ov.append(e);
    }
    if (Co.to_label) {
      const ta = clamp((k - (Co.draw || 1.1)) / .35);
      const e = el(`<div class="dest"></div>`); e.textContent = Co.to_label;
      e.style.left = b.x + "px"; e.style.top = (b.y - 26) + "px"; e.style.opacity = ta * out; ov.append(e);
    }
  }
  document.getElementById("credit").style.opacity = track(scene.credit_opacity || [[0, 1]], t);
}

/* ---------- per-frame ---------- */
const setOp = (id, prop, v) => { if (map.getLayer(id)) map.setPaintProperty(id, prop, v); };
window.renderFrame = async function (t) {
  const cam = camera(scene.camera, t);
  map.jumpTo({ center: cam.center, zoom: cam.zoom, pitch: cam.pitch || 0, bearing: cam.bearing || 0 });
  const L = scene.layers || {};
