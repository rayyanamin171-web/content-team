<!-- Preset: LOWER THIRD (name + licence line). Sits above the caption band, left-aligned, clear of the right action rail. -->
<template>
  <style>
    {{FONTFACE}}
    #root { position: absolute; inset: 0; }
    #lt-box { position: absolute; left: 64px; top: {{TOP}}px; padding: 20px 34px 22px 30px; background: {{GLASS}};
      border-left: 6px solid {{GOLD}}; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
    #lt-name { font: 700 58px/1.05 "RM Serif", serif; color: {{PAPER}}; letter-spacing: .2px; white-space: nowrap; }
    #lt-line { font: 600 30px/1 "RM Sans", sans-serif; color: {{GOLD}}; letter-spacing: 5px; text-transform: uppercase; margin-top: 12px; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="lowerthird" data-width="1080" data-height="1920">
    <div id="lt-box"><div id="lt-name">{{NAME}}</div><div id="lt-line">{{LINE}}</div></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#lt-box", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.05);
    tl.fromTo("#lt-name", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.15);
    tl.fromTo("#lt-line", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
    tl.to("#lt-box", { opacity: 0, x: -24, duration: 0.25, ease: "power2.in" }, {{DUR}} - 0.3);
    window.__timelines["lowerthird"] = tl;
  </script>
</template>
