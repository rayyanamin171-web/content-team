<!-- Preset: CAPTIONS ("navy pill, gold active word"). Groups of 2-4 words; one group visible at a time.
     Generated by build_reel.py from word timings (faster-whisper on the Mac, or an SRT). Times are local to this scene. -->
<template>
  <style>
    {{FONTFACE}}
    #root { position: absolute; inset: 0; }
    .cg { position: absolute; left: 0; width: 1080px; top: {{TOP}}px; text-align: center; overflow: visible; }
    .cg-pill { display: inline-block; max-width: 880px; padding: 14px 26px 18px; background: rgba(14,26,43,.74); border-radius: 18px;
      font: 700 {{SIZE}}px/1.18 "RM Sans", sans-serif; color: {{PAPER}}; letter-spacing: -.3px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .cw { display: inline-block; margin: 0 .12em; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
{{GROUPS}}
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const G = {{GROUP_JSON}};
    for (const g of G) {
      const el = document.getElementById(g.id), pill = el.querySelector(".cg-pill");
      tl.fromTo(pill, { opacity: 0, scale: 0.94, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "power3.out" }, g.start);
      for (const w of g.words) {
        const we = document.getElementById(w.id);
        tl.set(we, { color: "{{PAPER}}" }, g.start);
        tl.set(we, { color: "{{GOLD}}" }, w.start);
        if (w.end < g.end - 0.01) tl.set(we, { color: "{{PAPER}}" }, w.end);
      }
      tl.to(pill, { opacity: 0, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
      tl.set(el, { opacity: 0, visibility: "hidden" }, g.end);
    }
    window.__timelines["captions"] = tl;
  </script>
</template>
