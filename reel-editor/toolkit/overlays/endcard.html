<!-- Preset: END CARD (series label, island, one CTA, name + licence). Full navy, everything inside y 168-1330. -->
<template>
  <style>
    {{FONTFACE}}
    #root { position: absolute; inset: 0; }
    #ec-bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background:
      radial-gradient(ellipse 90% 55% at 50% 38%, #172A45 0%, {{NAVY}} 70%); }
    #ec-box { position: absolute; left: 72px; right: 72px; top: 330px; text-align: center; }
    #ec-kicker { font: 600 32px/1 "RM Sans", sans-serif; letter-spacing: 7px; text-transform: uppercase; color: {{GOLD}}; }
    #ec-title { font: 700 128px/1.0 "RM Serif", serif; color: {{PAPER}}; margin-top: 34px; letter-spacing: -1px; }
    #ec-rule { width: 160px; height: 4px; background: {{GOLD}}; margin: 44px auto 56px; }
    #ec-cta { display: inline-block; background: {{GOLD}}; color: {{NAVY}}; font: 800 58px/1 "RM Sans", sans-serif; padding: 30px 46px; letter-spacing: .5px; }
    #ec-cta-sub { font: 500 34px/1.3 "RM Sans", sans-serif; color: {{PAPER}}; opacity: .9; margin-top: 26px; }
    #ec-sign { position: absolute; left: 72px; right: 72px; top: 1150px; text-align: center; }
    #ec-name { font: 700 46px/1 "RM Serif", serif; color: {{PAPER}}; }
    #ec-meta { font: 600 28px/1.5 "RM Sans", sans-serif; color: {{GOLD}}; letter-spacing: 4px; text-transform: uppercase; margin-top: 14px; }
  </style>
  <div id="root" data-composition-id="endcard" data-width="1080" data-height="1920">
    <div id="ec-bg"></div>
    <div id="ec-box">
      <div id="ec-kicker">{{KICKER}}</div>
      <div id="ec-title">{{TITLE}}</div>
      <div id="ec-rule"></div>
      <div id="ec-cta">{{CTA}}</div>
      <div id="ec-cta-sub">{{CTA_SUB}}</div>
    </div>
    <div id="ec-sign"><div id="ec-name">{{NAME}}</div><div id="ec-meta">{{META}}</div></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#ec-kicker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
    tl.fromTo("#ec-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.08);
    tl.fromTo("#ec-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.15);
    tl.fromTo("#ec-cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.22);
    tl.fromTo("#ec-cta-sub", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.32);
    tl.fromTo("#ec-sign", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.36);
    window.__timelines["endcard"] = tl;
  </script>
</template>
