<!-- Preset: GLASS WIDGETS (frosted cards over footage). Generated by build_reel.py from config "widgets".
     Kinds: fact (label + big value + sub), chip (pin icon + text), list (title + ticked items), stat (big number + label + source line).
     Frosted glass = backdrop blur over the live footage + white 14% fill + hairline border + soft shadow; gold for the one accent.
     Motion: rise 28 px + blur 8 -> 0 in 0.45 s (expo.out), items stagger 90 ms, exit 0.25 s. Times are local to this scene. -->
<template>
  <style>
    {{FONTFACE}}
    #root { position: absolute; inset: 0; }
    .wg { position: absolute; overflow: visible; }
    .glass { position: relative; border-radius: 28px; padding: 26px 34px 28px;
      background: linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,.08)), rgba(14,26,43,.30);
      backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1.5px solid rgba(255,255,255,.32); box-shadow: 0 18px 50px rgba(8,14,24,.35), inset 0 1px 0 rgba(255,255,255,.35);
      color: {{PAPER}}; }
    .lbl { font: 700 24px/1 "RM Sans", sans-serif; letter-spacing: 5px; text-transform: uppercase; color: {{GOLD}}; }
    .val { font: 700 64px/1.05 "RM Serif", serif; margin-top: 12px; letter-spacing: -.5px; }
    .sub { font: 500 30px/1.3 "RM Sans", sans-serif; margin-top: 10px; opacity: .92; }
    .src { font: 500 22px/1.3 "RM Sans", sans-serif; margin-top: 14px; opacity: .7; }
    .stat .val { font: 800 96px/1 "RM Sans", sans-serif; letter-spacing: -2px; }
    .chip { display: inline-flex; align-items: center; gap: 16px; border-radius: 999px; padding: 18px 30px 18px 22px; }
    .chip svg { width: 38px; height: 38px; flex: none; }
    .chip .t { font: 700 34px/1 "RM Sans", sans-serif; letter-spacing: .3px; }
    .chip .s { font: 600 24px/1 "RM Sans", sans-serif; letter-spacing: 4px; text-transform: uppercase; color: {{GOLD}}; margin-left: 4px; }
    .list .it { display: flex; align-items: center; gap: 18px; font: 600 36px/1.25 "RM Sans", sans-serif; margin-top: 18px; }
    .list .tick { width: 40px; height: 40px; border-radius: 50%; background: {{GOLD}}; flex: none; display: grid; place-items: center; }
    .list .tick svg { width: 22px; height: 22px; }
  </style>
  <div id="root" data-composition-id="widgets" data-width="1080" data-height="1920">
{{WIDGETS}}
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const W = {{WIDGET_JSON}};
    for (const w of W) {
      const card = document.querySelector("#" + w.id + " .glass");
      tl.fromTo(card, { opacity: 0, y: 28, filter: "blur(8px)", scale: 0.97 },
        { opacity: 1, y: 0, filter: "blur(0px)", scale: 1, duration: 0.45, ease: "expo.out" }, w.start + 0.02);
      document.querySelectorAll("#" + w.id + " .stg").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, w.start + 0.22 + i * 0.09);
      });
      tl.to(card, { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, w.end - 0.27);
    }
    window.__timelines["widgets"] = tl;
  </script>
</template>
