<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP 3.15.0 vendored locally (from npm): this cloud session blocks cdn.jsdelivr.net. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Smoke test: 5 s "Abu Dhabi Series – Part 1" title card, 1080x1920, in the Reel cover's palette and fonts. */
      @font-face { font-family: "Playfair Display"; src: url("fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "InterF"; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      :root { --ground: #0E1A2B; --gold: #C8A15A; --ink: #F5F1E8; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        width: 100%; height: 100%; position: relative;
        background: radial-gradient(120% 70% at 50% 75%, #2A3F63 0%, var(--ground) 60%);
      }
      #series {
        position: absolute; top: 640px; left: 0; right: 0; text-align: center;
        font-family: "InterF", sans-serif; font-weight: 600; font-size: 48px; letter-spacing: 5px;
        color: var(--gold); text-transform: uppercase;
      }
      #rule { position: absolute; top: 740px; left: 480px; width: 120px; height: 4px; background: var(--gold); transform-origin: center; }
      #island {
        position: absolute; top: 820px; left: 0; right: 0; text-align: center;
        font-family: "Playfair Display", serif; font-weight: 700; font-size: 168px; line-height: .98; color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="series" class="clip" data-start="0" data-duration="5" data-track-index="0">Abu Dhabi Series – Part 1</div>
      <div id="rule" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div id="island" class="clip" data-start="0" data-duration="5" data-track-index="2">Al Maryah<br />Island</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Series label is on screen from frame 0: the first frame doubles as the social thumbnail.
      tl.fromTo("#series", { y: 12 }, { y: 0, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.7);
      tl.fromTo("#island", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 1.0);
      tl.to("#root", { opacity: 0, duration: 0.5, ease: "power1.in" }, 4.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
